server {
    listen 80;
    server_name _ your-domain.com www.your-domain.com;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Client body size for large lead files (CSV/XLSX up to 150MB)
    client_max_body_size 150M;

    # Static Frontend Assets (Vite build)
    root /var/www/bla-checker/frontend/dist;
    index index.html;

    # IP allowlist gate (403 from API is shown as 404 to visitors)
    location = /api/security/gate {
        internal;
        proxy_pass http://127.0.0.1:5000/api/security/gate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
    }

    location / {
        auth_request /api/security/gate;
        error_page 403 = @ip_blocked;
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    location @ip_blocked {
        default_type text/html;
        return 404 '<!DOCTYPE html><html><head><meta charset="utf-8"><title>404 Not Found</title></head><body style="margin:0;background:#020806;color:#a1a1aa;font-family:system-ui,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;flex-direction:column"><h1 style="color:#fff;font-size:3.5rem;margin:0">404</h1><p>NOT FOUND</p></body></html>';
    }

    # Large clean-list downloads must stream. Buffering the whole file makes nginx return 502.
    location ~ ^/api/sessions/[^/]+/export/ {
        proxy_pass http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_buffering off;
        gzip off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # API Proxy to Express Backend (PM2)
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for large file scrubbing
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
